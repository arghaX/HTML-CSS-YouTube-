<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-practice</title>
</head>
<body style="padding: 10px;background-color:red;">
    <div style="
    display:grid;
    grid-template-columns: 100px 100px;">
        <div style="background-color: aqua;">
            div1
        </div>
        <div style="background-color: grey;">
            div2 <p>afagyga</p>
        </div>
    </div>

    <div style="
    margin-top:10px;
    display:grid;
    grid-template-columns: 100px 100px 200px;">
        <div style="background-color: aqua;">
            div1 100px
        </div>
        <div style="background-color: grey;">
            div2 <p>afagyga</p>
        </div>
        <div style="background-color: aqua;">
            div3
        </div>
        <div style="background-color: grey;">
            div4 <p>afagyga</p>
        </div>
    </div>
    <div style="
    margin-top:10px;
    display:grid;
    grid-template-columns: 100px 1fr;">
        <div style="background-color: aqua;">
            100px
        </div>
        <div style="background-color: grey;">
            1fr
        </div>
        
    </div>
    <div style="
    margin-top:10px;
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    column-gap:20px;
    row-gap:40px">
        <div style="background-color: aqua ; height:200px;">
            100px
        </div>
        <div style="background-color: grey;height:200px;">
            1fr
        </div>
        <div style="background-color: aqua;height:200px;">
            1fr
        </div>
        <div style="background-color: grey;height:200px;">
            1fr
        </div>
        <div style="background-color: aqua;height:200px;">
            1fr
        </div>
        <div style="background-color: grey;height:200px;">
            1fr
        </div>
    </div>
</body>
</body>
</html>
